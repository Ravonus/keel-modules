name: verify

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint every module and the template
        run: pnpm lint
      - name: Typecheck every module and the template
        run: pnpm typecheck
      - name: Run every module's test vectors against the readable source
        run: pnpm vectors
      - name: Check the committed catalog against the committed sources
        run: pnpm check:catalog

      # This repository runs the checks that need no toolchain. The checks that
      # need one, because they rebuild, run in keel-sdk's `modules-verify`
      # workflow: it reproduces every module, runs the vectors against the
      # minified bytes, proves the committed catalog is byte reproducible, and
      # re-verifies every registered origin, daily and on every push.
      #
      # It lives there because that is where the builder is, and because this
      # repository's own CI is deliberately toolchain-free: every check here
      # runs with nothing but Node, so a contributor can run all of them
      # locally without installing the SDK.
