name: verify

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint every module and the template
        run: pnpm lint
      - name: Typecheck every module and the template
        run: pnpm typecheck
      - name: Run every module's test vectors against the readable source
        run: pnpm vectors
      - name: Check the committed catalog against the committed sources
        run: pnpm check:catalog

      # The catalog check above proves the committed digests still describe the
      # committed sources, which is the failure a pull request actually tends
      # to introduce. It cannot prove a build REPRODUCES; only the keel CLI
      # can, and it is not published to npm yet. Until it is, reproduction is
      # enforced from the keel-sdk side by
      # tests/keel-modules-reproduction.test.mjs, which fetches this repository
      # from GitHub at its current commit and rebuilds every module.
      #
      # TODO: once `@keel/builder` is on npm, add here:
      #   keel module build --all && keel module test --all
      #   keel module index && git diff --exit-code catalog/catalog.json
      # The last line is the real gate: indexing is deterministic and reads
      # only committed files, so a clean tree must produce a clean diff.
