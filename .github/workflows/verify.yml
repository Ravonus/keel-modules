name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck every module and the template
        run: |
          status=0
          for config in modules/*/tsconfig.json template/tsconfig.json; do
            echo "== tsc -p $config"
            ./node_modules/.bin/tsc -p "$config" || status=1
          done
          exit "$status"

      # TODO: enable once the keel CLI is published. For every changed module,
      # run `keel module build` and fail unless the rebuilt minified output and
      # build recipe digests match the committed keel-source-receipt@1.
      # - name: Reproduce module builds
      #   run: keel module build --check modules/*
